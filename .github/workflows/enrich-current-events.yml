name: Enrich current events now

on:
  workflow_dispatch:
  push:
    paths:
      - "data/manual_refresh_trigger.txt"
      - ".github/workflows/enrich-current-events.yml"

permissions:
  contents: write

concurrency:
  group: trentino-event-enrich-now
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-crawler.txt


      - name: Enrich event detail links and images
        run: python scripts/enrich_event_links_and_images.py

      - name: Commit refreshed events
        run: |
          git config user.name "trentino-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          if git diff --cached --quiet; then
            echo "No event enrichment changes."
            exit 0
          fi
          git commit -m "Enrich current event images and links"
          git pull --rebase origin main
          git push origin HEAD:main
