name: Enumerate event sources

on:
  workflow_dispatch:
  schedule:
    # 03:15 UTC = 05:15 CEST / 04:15 CET. This intentionally leaves
    # substantial headroom before the 07:00 Europe/Rome AI maintenance pass.
    - cron: "15 3 * * *"
  push:
    paths:
      - "scripts/enumerate_sources.py"
      - "scripts/build_discovery_delta.py"
      - "scripts/promote_candidates.py"
      - "requirements-crawler.txt"
      - "data/source_registry.json"
      - ".github/workflows/enumerate-events.yml"

permissions:
  contents: write

concurrency:
  group: trentino-event-enumerator
  cancel-in-progress: true

jobs:
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-crawler.txt

      - name: Install crawler dependencies
        run: pip install -r requirements-crawler.txt

      - name: Enumerate mandatory event sources
        run: python scripts/enumerate_sources.py

      - name: Build stable discovery delta
        run: python scripts/build_discovery_delta.py

      - name: Promote verified calendar candidates to live database
        run: python scripts/promote_candidates.py

      - name: Commit coverage and live event update
        run: |
          git config user.name "trentino-events-bot"
          git config user.email "actions@users.noreply.github.com"

          # Avoid overwriting newer human/AI edits with a stale crawl.
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Repository advanced during this crawl; discarding stale snapshot."
            exit 0
          fi

          git add data/source_audit.json data/discovered_candidates.json data/discovery_delta.json data/events.json
          if git diff --cached --quiet; then
            echo "No coverage or event changes."
          else
            git commit -m "Update event coverage and live website data"
            git push origin HEAD:main
          fi
