name: Enrich current events now

on:
  workflow_dispatch:
  push:
    paths:
      - "data/manual_refresh_trigger.txt"
      - ".github/workflows/enrich-current-events.yml"

permissions:
  contents: write

concurrency:
  group: trentino-event-enrich-now
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_SOCIAL_MODEL: gpt-5-mini
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify API secret is configured
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "OPENAI_API_KEY is missing"
            exit 1
          fi
          echo "OPENAI_API_KEY is configured"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-crawler.txt openai

      - name: Discover public Facebook-linked events
        run: python scripts/discover_public_social.py

      - name: Enrich event detail links and images
        run: python scripts/enrich_event_links_and_images.py

      - name: Commit refreshed events
        run: |
          git config user.name "trentino-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/events.json
          git add data/facebook_candidates.json data/social_delta.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No event enrichment changes."
            exit 0
          fi
          git commit -m "Enrich current event images and links"
          git pull --rebase origin main
          git push origin HEAD:main
