name: Repair event summaries

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/generate_event_summaries.py"
      - "scripts/event_descriptions.py"
      - "scripts/merge_summary_updates.py"
      - ".github/workflows/event-summaries.yml"
  workflow_run:
    workflows: ["Enumerate event sources", "Enrich current events now", "Publish current event snapshot", "Weekly public social event discovery"]
    types: [completed]

permissions:
  contents: write

jobs:
  summaries:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: trentino-event-summaries
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_SUMMARY_MODEL: gpt-5-mini
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements-crawler.txt openai
      - name: Verify summary extraction and validation
        run: python -m unittest discover -s tests
      - name: Repair missing event summaries and translations
        run: |
          mkdir -p .cache
          git show HEAD:data/events.json > .cache/base-events.json
          python scripts/generate_event_summaries.py
      - name: Publish updated descriptions
        run: |
          git config user.name "trentino-events-bot"
          git config user.email "actions@users.noreply.github.com"
          cp data/events.json .cache/generated-events.json
          git restore -- data/events.json data/description_audit.json
          git fetch origin main
          git merge --ff-only origin/main
          python scripts/merge_summary_updates.py .cache/base-events.json .cache/generated-events.json data/events.json
          python scripts/generate_event_summaries.py --audit-only
          git add data/events.json data/description_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fill source-backed multilingual event summaries"
          git push origin HEAD:main
